name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\.gradle\wrapper\dists
          key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('companion/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build and lint
        shell: pwsh
        run: .\build.ps1 -Target Android
      - name: Run unit tests
        shell: pwsh
        run: |
          .\companion\gradlew.bat -p .\companion ':app:testDebugUnitTest'
          if ($LASTEXITCODE -ne 0) { throw "Android unit tests failed with exit code $LASTEXITCODE." }

  watch:
    name: Watch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Connect IQ SDK manager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}\connect-iq-sdk-manager.tar.gz
          key: connect-iq-manager-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-garmin-ci.ps1') }}
      - name: Install Connect IQ SDK and devices
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.CIQ_GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.CIQ_GARMIN_PASSWORD }}
          GARMIN_AGREEMENT_HASH: ${{ vars.CIQ_GARMIN_AGREEMENT_HASH }}
        run: .\scripts\setup-garmin-ci.ps1
      - name: Build watch apps
        shell: pwsh
        env:
          CI_KEY_BASE64: ${{ secrets.CIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CI_KEY_BASE64)) {
            throw 'Configure a separate Connect IQ CI developer key.'
          }
          $key = Join-Path $env:RUNNER_TEMP 'connect-iq-ci-key.der'
          try {
            [System.IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:CI_KEY_BASE64))
            .\build.ps1 -Target Watch -GarminDeveloperKey $key
          } finally {
            if (Test-Path -LiteralPath $key -PathType Leaf) {
              Remove-Item -LiteralPath $key -Force
            }
          }

  official:
    name: Official release candidate
    needs: [android, watch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: 'Official Build'
    steps:
      - name: Require exact main ref
        shell: pwsh
        run: |
          if (-not [string]::Equals($env:GITHUB_REF, 'refs/heads/main', [StringComparison]::Ordinal)) {
            throw 'Official builds require the main branch.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\.gradle\wrapper\dists
          key: gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('companion/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Cache Connect IQ SDK manager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}\connect-iq-sdk-manager.tar.gz
          key: connect-iq-manager-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-garmin-ci.ps1') }}
      - name: Install Connect IQ SDK and devices
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.CIQ_GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.CIQ_GARMIN_PASSWORD }}
          GARMIN_AGREEMENT_HASH: ${{ vars.CIQ_GARMIN_AGREEMENT_HASH }}
        run: .\scripts\setup-garmin-ci.ps1
      - name: Build and verify signed release candidate
        shell: pwsh
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          CIQ_RELEASE_PUBLIC_KEY_SHA256: ${{ vars.CIQ_RELEASE_PUBLIC_KEY_SHA256 }}
          GARMIN_KEY_BASE64: ${{ secrets.CIQ_RELEASE_DEVELOPER_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ANDROID_KEY_BASE64', 'ANDROID_RELEASE_KEY_ALIAS',
                               'ANDROID_RELEASE_KEYSTORE_PASSWORD', 'ANDROID_RELEASE_KEY_PASSWORD',
                               'ANDROID_RELEASE_CERT_SHA256', 'CIQ_RELEASE_PUBLIC_KEY_SHA256', 'GARMIN_KEY_BASE64')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Official signing configuration is missing: $name"
            }
          }
          $androidKey = Join-Path $env:RUNNER_TEMP 'fta-android-release.keystore'
          $garminKey = Join-Path $env:RUNNER_TEMP 'fta-garmin-release.der'
          try {
            [IO.File]::WriteAllBytes($androidKey, [Convert]::FromBase64String($env:ANDROID_KEY_BASE64))
            [IO.File]::WriteAllBytes($garminKey, [Convert]::FromBase64String($env:GARMIN_KEY_BASE64))
            $env:ANDROID_RELEASE_KEYSTORE_PATH = $androidKey
            .\build.ps1 -Configuration Release -Official -GarminDeveloperKey $garminKey
          } finally {
            foreach ($key in @($androidKey, $garminKey)) {
              if (Test-Path -LiteralPath $key -PathType Leaf) {
                Remove-Item -LiteralPath $key -Force
              }
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: official-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build\official
          if-no-files-found: error
