name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and lint
        shell: pwsh
        run: .\build.ps1 -Target Android
      - name: Run unit tests
        shell: pwsh
        run: |
          .\companion\gradlew.bat -p .\companion ':app:testDebugUnitTest'
          if ($LASTEXITCODE -ne 0) { throw "Android unit tests failed with exit code $LASTEXITCODE." }

  watch:
    name: Watch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'connect-iq-sdk-manager.tar.gz'
          $url = 'https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v0.8.4/connect-iq-sdk-manager-cli_0.8.4_Windows_x86_64.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '989cb7e037330213ada7d77a977adac7dc05468465998c503684e2abc9f790bf'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Connect IQ SDK manager checksum mismatch.'
          }
          tar.exe -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'SDK manager extraction failed.' }
      - name: Install Connect IQ SDK and devices
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.CIQ_GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.CIQ_GARMIN_PASSWORD }}
          GARMIN_AGREEMENT_HASH: ${{ vars.CIQ_GARMIN_AGREEMENT_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GARMIN_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:GARMIN_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:GARMIN_AGREEMENT_HASH)) {
            throw 'Configure the Garmin CI credentials and reviewed agreement hash.'
          }
          $manager = Join-Path $env:RUNNER_TEMP 'connect-iq-sdk-manager.exe'
          & $manager agreement accept --agreement-hash $env:GARMIN_AGREEMENT_HASH --log-level error
          if ($LASTEXITCODE -ne 0) { throw 'Connect IQ agreement acceptance failed.' }
          & $manager login --log-level error
          if ($LASTEXITCODE -ne 0) { throw 'Garmin CI login failed.' }
          & $manager sdk set '=9.3.0' --log-level error
          if ($LASTEXITCODE -ne 0) { throw 'Connect IQ SDK installation failed.' }
          & $manager device download --manifest (Join-Path $env:GITHUB_WORKSPACE 'watch\manifest.xml') --log-level error
          if ($LASTEXITCODE -ne 0) { throw 'Connect IQ device installation failed.' }
          $sdk = (& $manager sdk current-path --log-level error | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $sdk 'bin\monkeyc.bat') -PathType Leaf)) {
            throw 'Installed Connect IQ compiler was not found.'
          }
          "GARMIN_SDK=$sdk" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build watch apps
        shell: pwsh
        env:
          CI_KEY_BASE64: ${{ secrets.CIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CI_KEY_BASE64)) {
            throw 'Configure a separate Connect IQ CI developer key.'
          }
          $key = Join-Path $env:RUNNER_TEMP 'connect-iq-ci-key.der'
          try {
            [System.IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:CI_KEY_BASE64))
            .\build.ps1 -Target Watch -GarminDeveloperKey $key
          } finally {
            if (Test-Path -LiteralPath $key -PathType Leaf) {
              Remove-Item -LiteralPath $key -Force
            }
          }
